<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Médicos</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">
        <i class="bi bi-calendar-plus-fill"></i> Registro de Médicos
    </h2>
    <a href="/horario/registro/inicio" class="btn btn-outline-primary">
        <i class="bi bi-person-plus-fill"></i> Nueva Horario Médico
    </a>
</div>

<!-- Alertas -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <th:block th:text="${success}"></th:block>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Formulario -->
<form th:action="@{/medico/guardar}" method="post" th:object="${medico}" class="row g-3 mb-4 shadow-sm p-4 border rounded bg-light">
    <input type="hidden" th:field="*{idMedico}"/>

    <!-- Nombre -->
    <div class="col-md-6">
        <label class="form-label">Nombre:</label>
        <input type="text" th:field="*{nombre}" class="form-control" required>
    </div>

    <!-- Apellido -->
    <div class="col-md-6">
        <label class="form-label">Apellido:</label>
        <input type="text" th:field="*{apellido}" class="form-control" required>
    </div>

    <!-- Especialidad -->
    <div class="col-md-6">
        <label class="form-label">Especialidad:</label>
        <select th:field="*{especialidad.idEspecialidad}" class="form-select" required>
            <option value="">Seleccione especialidad</option>
            <option th:each="e : ${especialidades}" th:value="${e.idEspecialidad}" th:text="${e.nombre}"></option>
        </select>
    </div>

    <!-- Teléfono -->
    <div class="col-md-4">
        <label class="form-label">Teléfono:</label>
        <input type="text" th:field="*{telefono}" class="form-control">
    </div>

    <!-- Estado -->
    <div class="col-md-2">
        <label class="form-label">Estado:</label>
        <select th:field="*{estado}" class="form-select">
            <option th:value="true">Activo</option>
            <option th:value="false">Inactivo</option>
        </select>
    </div>

    <!-- Botón Guardar -->
    <div class="col-12 text-end">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-save-fill"></i> Guardar
        </button>
    </div>
</form>

<!-- Tabla -->
<h3><i class="bi bi-list-ul"></i> Lista de Médicos</h3>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nombre</th><th>Apellido</th><th>Especialidad</th><th>Teléfono</th><th>Estado</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${medicos}">
            <td th:text="${m.idMedico}"></td>
            <td th:text="${m.nombre}"></td>
            <td th:text="${m.apellido}"></td>
            <td th:text="${m.especialidad.nombre}"></td>
            <td th:text="${m.telefono}"></td>
            <td>
                <span th:text="${m.estado ? 'Activo' : 'Inactivo'}"
                      th:classappend="${m.estado ? 'badge bg-success' : 'badge bg-danger'}"></span>
            </td>
            <td>
                <a th:href="@{/medico/editar(idMedico=${m.idMedico})}" class="btn btn-warning btn-sm">
                    <i class="bi bi-pencil-square"></i>
                </a>
                <a th:href="@{/medico/eliminar/{id}(id=${m.idMedico})}"
                   onclick="return confirm('¿Eliminar médico?')"
                   class="btn btn-danger btn-sm">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
