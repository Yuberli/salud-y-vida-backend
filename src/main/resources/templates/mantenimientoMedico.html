<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Médicos</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{security/layout::menu}" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4"></nav>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">
        <i class="bi bi-person-plus-fill"></i> Registro de Médicos
    </h2>
    <a href="/horario/registro/inicio" class="btn btn-outline-primary">
        <i class="bi bi-hourglass-top"></i> Nuevo Horario Médico
    </a>
</div>

<!-- Alertas -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <th:block th:text="${success}"></th:block>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Formulario Principal -->
<form th:action="@{/medico/guardar}" method="post" th:object="${medico}" class="row g-3 mb-4 shadow-sm p-4 border rounded bg-light">
    <input type="hidden" th:field="*{idMedico}"/>

    <div class="col-md-6">
        <label class="form-label">Nombre:</label>
        <input type="text" th:field="*{nombre}" class="form-control" required>
    </div>

    <div class="col-md-6">
        <label class="form-label">Apellido:</label>
        <input type="text" th:field="*{apellido}" class="form-control" required>
    </div>

    <div class="col-md-6">
        <label class="form-label">Especialidad:</label>
        <select th:field="*{especialidad.idEspecialidad}" class="form-select" required>
            <option value="">Seleccione especialidad</option>
            <option th:each="e : ${especialidades}" th:value="${e.idEspecialidad}" th:text="${e.nombre}"></option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Teléfono:</label>
        <input type="text" th:field="*{telefono}" class="form-control">
    </div>

    <div class="col-md-2">
        <label class="form-label">Estado:</label>
        <select th:field="*{estado}" class="form-select">
            <option th:value="true">Activo</option>
            <option th:value="false">Inactivo</option>
        </select>
    </div>

    <div class="col-12 text-end">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-download"></i> Guardar
        </button>
    </div>
</form>

<!-- Tabla -->
<h3><i class="bi bi-list-ul"></i> Lista de Médicos</h3>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nombre</th><th>Apellido</th><th>Especialidad</th><th>Teléfono</th><th>Estado</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${medicos}">
            <td th:text="${m.idMedico}"></td>
            <td th:text="${m.nombre}"></td>
            <td th:text="${m.apellido}"></td>
            <td th:text="${m.especialidad.nombre}"></td>
            <td th:text="${m.telefono}"></td>
            <td>
                <span th:text="${m.estado ? 'Activo' : 'Inactivo'}"
                      th:classappend="${m.estado ? 'badge bg-success' : 'badge bg-danger'}"></span>
            </td>
            <td>
                <button
                        class="btn btn-warning btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#modalEditarMedico"
                        th:attr="data-id=${m.idMedico},
                             data-nombre=${m.nombre},
                             data-apellido=${m.apellido},
                             data-especialidad=${m.especialidad.idEspecialidad},
                             data-telefono=${m.telefono},
                             data-estado=${m.estado}">
                    <i class="bi bi-pencil-square"></i>
                </button>

                <a th:href="@{/medico/eliminar/{id}(id=${m.idMedico})}"
                   onclick="return confirm('¿Eliminar médico?')"
                   class="btn btn-danger btn-sm">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal Editar Médico -->
<div class="modal fade" id="modalEditarMedico" tabindex="-1" aria-labelledby="modalEditarMedicoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/medico/guardar}" method="post">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title" id="modalEditarMedicoLabel"><i class="bi bi-pencil-square"></i> Editar Médico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body row g-3">
                    <input type="hidden" name="idMedico" id="editIdMedico">

                    <div class="col-md-6">
                        <label class="form-label">Nombre:</label>
                        <input type="text" name="nombre" id="editNombre" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Apellido:</label>
                        <input type="text" name="apellido" id="editApellido" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Especialidad:</label>
                        <select name="especialidad.idEspecialidad" id="editEspecialidad" class="form-select" required>
                            <option value="">Seleccione especialidad</option>
                            <option th:each="e : ${especialidades}" th:value="${e.idEspecialidad}" th:text="${e.nombre}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Teléfono:</label>
                        <input type="text" name="telefono" id="editTelefono" class="form-control">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Estado:</label>
                        <select name="estado" id="editEstado" class="form-select">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save2-fill"></i> Guardar Cambios</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS y Script para cargar datos al modal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modalEditarMedico = document.getElementById('modalEditarMedico');
    modalEditarMedico.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;

        document.getElementById('editIdMedico').value = button.getAttribute('data-id');
        document.getElementById('editNombre').value = button.getAttribute('data-nombre');
        document.getElementById('editApellido').value = button.getAttribute('data-apellido');
        document.getElementById('editEspecialidad').value = button.getAttribute('data-especialidad');
        document.getElementById('editTelefono').value = button.getAttribute('data-telefono');
        document.getElementById('editEstado').value = button.getAttribute('data-estado');
    });
</script>

</div>
</body>
</html>
