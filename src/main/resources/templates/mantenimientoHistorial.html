<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Historias Clínicas</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{security/layout::menu}" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4"></nav>

<div class="container py-4">

<h2 class="mb-4"><i class="bi bi-clipboard2-pulse"></i> Gestión de Historias Clínicas</h2>

<!-- Buscador -->
<form th:action="@{/historial/inicio}" method="get" class="row g-3 mb-4 shadow-sm p-3 border rounded bg-light">
    <div class="col-md-10">
        <input type="text" name="nombre" class="form-control" placeholder="Buscar por nombre de paciente" th:value="${nombreBuscado}">
    </div>
    <div class="col-md-2 text-end">
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Buscar</button>
    </div>
</form>

<!-- Tabla de historiales -->
<div class="table-responsive shadow-sm p-3 border rounded bg-light">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Descripción</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${lista}">
            <td th:text="${h.idHistoria}"></td>
            <td th:text="${h.paciente.nombre + ' ' + h.paciente.apellido}"></td>
            <td th:text="${#strings.abbreviate(h.descripcion, 50)}"></td>
            <td th:text="${h.fechaRegistro}"></td>
            <td>
                <a th:href="@{/historial/detalle/{idPaciente}(idPaciente=${h.paciente.idPaciente})}" class="btn btn-sm btn-primary">
                    <i class="bi bi-eye"></i> Ver
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</div>
</body>
</html>
