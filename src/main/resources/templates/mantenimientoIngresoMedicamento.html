<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ingreso de Medicamentos</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">
        <i class="bi bi-calendar-plus-fill"></i> Ingreso de Medicamento
    </h2>
    <a href="/medicamento/inicio" class="btn btn-outline-primary">
        <i class="bi bi-person-plus-fill"></i> Nuevo Medicamento
    </a>
</div>

<!-- Alertas -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <th:block th:text="${success}"></th:block>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <th:block th:text="${error}"></th:block>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Formulario de ingreso -->
<form th:action="@{/ingreso/guardar}" method="post" th:object="${ingresoMedicamento}"
      class="row g-3 mb-4 shadow-sm p-4 border rounded bg-light">

    <input type="hidden" th:field="*{idIngreso}"/>

    <!-- Proveedor -->
    <div class="col-md-6">
        <label class="form-label">Proveedor:</label>
        <select th:field="*{proveedor.idProveedor}" class="form-select" required>
            <option value="">Seleccione un proveedor</option>
            <option th:each="p : ${proveedores}"
                    th:value="${p.idProveedor}"
                    th:text="${p.razonSocial}">
            </option>
        </select>
    </div>

    <!-- Medicamento -->
    <div class="col-md-6">
        <label class="form-label">Medicamento:</label>
        <select th:field="*{medicamento.idMedicamento}" class="form-select" required>
            <option value="">Seleccione un medicamento</option>
            <option th:each="m : ${medicamentos}"
                    th:value="${m.idMedicamento}"
                    th:text="${m.nombre}">
            </option>
        </select>
    </div>

    <!-- Cantidad -->
    <div class="col-md-4">
        <label class="form-label">Cantidad Ingresada:</label>
        <input type="number" th:field="*{cantidad}" class="form-control" min="1" required>
    </div>

    <!-- Observaciones -->
    <div class="col-md-8">
        <label class="form-label">Observaciones:</label>
        <textarea th:field="*{observaciones}" class="form-control" rows="1"></textarea>
    </div>

    <!-- Botón Guardar -->
    <div class="col-12 text-end">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-save-fill"></i> Registrar Ingreso
        </button>
    </div>
</form>

<!-- Tabla de ingresos -->
<h3><i class="bi bi-list-ul"></i> Historial de Ingresos</h3>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Proveedor</th>
            <th>Medicamento</th>
            <th>Cantidad</th>
            <th>Fecha Ingreso</th>
            <th>Observaciones</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${ingresos}">
            <td th:text="${i.idIngreso}"></td>
            <td th:text="${i.proveedor.razonSocial}"></td>
            <td th:text="${i.medicamento.nombre}"></td>
            <td th:text="${i.cantidad}"></td>
            <td th:text="${#dates.format(i.fechaIngreso, 'yyyy-MM-dd')}"></td>
            <td th:text="${i.observaciones}"></td>
            <td>
                <a th:href="@{/ingreso/eliminar/{id}(id=${i.idIngreso})}"
                   onclick="return confirm('¿Eliminar ingreso?')"
                   class="btn btn-danger btn-sm">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
