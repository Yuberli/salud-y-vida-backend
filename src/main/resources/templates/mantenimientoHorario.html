<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Horarios de Médicos</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">
        <i class="bi bi-clock-fill"></i> Registro de Horarios de Médicos
    </h2>
    <a href="/medico/inicio" class="btn btn-outline-primary">
        <i class="bi bi-person-plus-fill"></i> Nuevo Médico
    </a>
</div>

<!-- Alertas -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Formulario de registro de horario -->
<form th:action="@{/horario/registro/guardar}" method="post" class="row g-3 mb-4 shadow-sm p-4 border rounded bg-light">

    <!-- Médico -->
    <div class="col-md-4">
        <label class="form-label">Médico:</label>
        <select name="idMedico" class="form-select" required>
            <option value="">Seleccione un médico</option>
            <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:text="${m.nombre + ' ' + m.apellido}"></option>
        </select>
    </div>

    <!-- Desde -->
    <div class="col-md-4">
        <label class="form-label">Desde:</label>
        <select name="desde" class="form-select" required>
            <option value="">Seleccione hora inicio</option>
            <option th:each="h : ${horasDisponibles}" th:value="${h}" th:text="${h}"></option>
        </select>
    </div>

    <!-- Hasta -->
    <div class="col-md-4">
        <label class="form-label">Hasta:</label>
        <select name="hasta" class="form-select" required>
            <option value="">Seleccione hora fin</option>
            <option th:each="h : ${horasDisponibles}" th:value="${h}" th:text="${h}"></option>
        </select>
    </div>

    <div class="col-12 text-end">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-download"></i> Registrar Horario
        </button>
    </div>
</form>

<!-- Tabla de horarios agrupados -->
<h3><i class="bi bi-list-ul"></i> Horarios Registrados</h3>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Médico</th>
            <th>Especialidad</th>
            <th>Bloques de Horario</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${horariosAgrupados}">
            <td th:text="${entry.key.nombre + ' ' + entry.key.apellido}"></td>
            <td th:text="${entry.key.especialidad.nombre}"></td>
            <td>
                <ul class="list-unstyled mb-0">
                    <li th:each="rango : ${entry.value}"
                        th:text="'Desde: ' + ${rango.inicio} + ' - Hasta: ' + ${rango.fin}"></li>
                </ul>
            </td>
            <td>
                <span class="text-muted">Rango agrupado</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
