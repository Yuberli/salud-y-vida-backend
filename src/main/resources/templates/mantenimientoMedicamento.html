<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Medicamentos</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">
        <i class="bi bi-capsule"></i> Registro de Medicamentos
    </h2>
    <a href="/ingreso/inicio" class="btn btn-outline-primary">
        <i class="bi bi-capsule"></i>
        <i class="bi bi-plus-circle-fill ms-1"></i>
        Nuevo Ingreso de Medicamento
    </a>
</div>

<!-- Alertas -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <th:block th:text="${success}"></th:block>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <th:block th:text="${error}"></th:block>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Formulario principal -->
<form th:action="@{/medicamento/guardar}" method="post" th:object="${medicamento}"
      class="row g-3 mb-4 shadow-sm p-4 border rounded bg-light">
    <input type="hidden" th:field="*{idMedicamento}" />

    <!-- Proveedor -->
    <div class="col-md-6">
        <label class="form-label">Proveedor:</label>
        <select th:field="*{proveedor.idProveedor}" class="form-select" required>
            <option value="">Seleccione un proveedor</option>
            <option th:each="p : ${proveedores}"
                    th:value="${p.idProveedor}"
                    th:text="${p.razonSocial}"></option>
        </select>
    </div>

    <!-- Nombre -->
    <div class="col-md-6">
        <label class="form-label">Nombre:</label>
        <input type="text" th:field="*{nombre}" class="form-control" required>
    </div>

    <!-- Presentación -->
    <div class="col-md-4">
        <label class="form-label">Presentación:</label>
        <input type="text" th:field="*{presentacion}" class="form-control" required>
    </div>

    <!-- Concentración -->
    <div class="col-md-4">
        <label class="form-label">Concentración:</label>
        <input type="text" th:field="*{concentracion}" class="form-control" required>
    </div>

    <!-- Unidad -->
    <div class="col-md-4">
        <label class="form-label">Unidad:</label>
        <input type="text" th:field="*{unidad}" class="form-control" required>
    </div>

    <!-- Stock Actual -->
    <div class="col-md-3">
        <label class="form-label">Stock Actual:</label>
        <input type="number" th:field="*{stockActual}" class="form-control" min="0" required>
    </div>

    <!-- Stock Mínimo -->
    <div class="col-md-3">
        <label class="form-label">Stock Mínimo:</label>
        <input type="number" th:field="*{stockMinimo}" class="form-control" min="0" required>
    </div>

    <!-- Estado -->
    <div class="col-md-3">
        <label class="form-label">Estado:</label>
        <select th:field="*{estado}" class="form-select">
            <option th:value="true" th:text="'Activo'"></option>
            <option th:value="false" th:text="'Inactivo'"></option>
        </select>
    </div>

    <!-- Botón Guardar -->
    <div class="col-12 text-end">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-download"></i> Guardar
        </button>
        <a href="/medicamento/inicio" class="btn btn-secondary"><i class="bi bi-plus-circle"></i> Nuevo Medicamento
        </a>
    </div>
</form>

<!-- Tabla de Medicamentos -->
<h3><i class="bi bi-list-ul"></i> Lista de Medicamentos</h3>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Proveedor</th><th>Nombre</th><th>Presentación</th><th>Concentración</th>
            <th>Unidad</th><th>Stock Actual</th><th>Stock Mínimo</th><th>Estado</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${lista}">
            <td th:text="${m.idMedicamento}"></td>
            <td th:text="${m.proveedor.razonSocial}"></td>
            <td th:text="${m.nombre}"></td>
            <td th:text="${m.presentacion}"></td>
            <td th:text="${m.concentracion}"></td>
            <td th:text="${m.unidad}"></td>
            <td th:text="${m.stockActual}"></td>
            <td th:text="${m.stockMinimo}"></td>
            <td>
                <span th:text="${m.estado ? 'Activo' : 'Inactivo'}"
                      th:classappend="${m.estado ? 'badge bg-success' : 'badge bg-danger'}"></span>
            </td>
            <td>
                <button
                        class="btn btn-warning btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#modalEditarMedicamento"
                        th:attr="data-id=${m.idMedicamento},
                             data-proveedor=${m.proveedor.idProveedor},
                             data-nombre=${m.nombre},
                             data-presentacion=${m.presentacion},
                             data-concentracion=${m.concentracion},
                             data-unidad=${m.unidad},
                             data-stockactual=${m.stockActual},
                             data-stockminimo=${m.stockMinimo},
                             data-estado=${m.estado}">
                    <i class="bi bi-pencil-square"></i>
                </button>

                <a th:href="@{/medicamento/eliminar/{id}(id=${m.idMedicamento})}"
                   onclick="return confirm('¿Eliminar medicamento?')"
                   class="btn btn-danger btn-sm">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal Editar Medicamento -->
<div class="modal fade" id="modalEditarMedicamento" tabindex="-1" aria-labelledby="modalEditarMedicamentoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/medicamento/guardar}" method="post">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title" id="modalEditarMedicamentoLabel"><i class="bi bi-pencil-square"></i> Editar Medicamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body row g-3">
                    <input type="hidden" name="idMedicamento" id="editIdMedicamento">

                    <!-- Proveedor -->
                    <div class="col-md-6">
                        <label class="form-label">Proveedor:</label>
                        <select name="proveedor.idProveedor" id="editProveedor" class="form-select" required>
                            <option value="">Seleccione un proveedor</option>
                            <option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.razonSocial}"></option>
                        </select>
                    </div>

                    <!-- Nombre -->
                    <div class="col-md-6">
                        <label class="form-label">Nombre:</label>
                        <input type="text" name="nombre" id="editNombre" class="form-control" required>
                    </div>

                    <!-- Presentación -->
                    <div class="col-md-4">
                        <label class="form-label">Presentación:</label>
                        <input type="text" name="presentacion" id="editPresentacion" class="form-control" required>
                    </div>

                    <!-- Concentración -->
                    <div class="col-md-4">
                        <label class="form-label">Concentración:</label>
                        <input type="text" name="concentracion" id="editConcentracion" class="form-control" required>
                    </div>

                    <!-- Unidad -->
                    <div class="col-md-4">
                        <label class="form-label">Unidad:</label>
                        <input type="text" name="unidad" id="editUnidad" class="form-control" required>
                    </div>

                    <!-- Stock Actual -->
                    <div class="col-md-3">
                        <label class="form-label">Stock Actual:</label>
                        <input type="number" name="stockActual" id="editStockActual" class="form-control" min="0" required>
                    </div>

                    <!-- Stock Mínimo -->
                    <div class="col-md-3">
                        <label class="form-label">Stock Mínimo:</label>
                        <input type="number" name="stockMinimo" id="editStockMinimo" class="form-control" min="0" required>
                    </div>

                    <!-- Estado -->
                    <div class="col-md-3">
                        <label class="form-label">Estado:</label>
                        <select name="estado" id="editEstado" class="form-select">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save2-fill"></i> Guardar Cambios</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS y Script Modal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modalEditarMedicamento = document.getElementById('modalEditarMedicamento');
    modalEditarMedicamento.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;

        document.getElementById('editIdMedicamento').value = button.getAttribute('data-id');
        document.getElementById('editProveedor').value = button.getAttribute('data-proveedor');
        document.getElementById('editNombre').value = button.getAttribute('data-nombre');
        document.getElementById('editPresentacion').value = button.getAttribute('data-presentacion');
        document.getElementById('editConcentracion').value = button.getAttribute('data-concentracion');
        document.getElementById('editUnidad').value = button.getAttribute('data-unidad');
        document.getElementById('editStockActual').value = button.getAttribute('data-stockactual');
        document.getElementById('editStockMinimo').value = button.getAttribute('data-stockminimo');
        document.getElementById('editEstado').value = button.getAttribute('data-estado');
    });
</script>

</body>
</html>
