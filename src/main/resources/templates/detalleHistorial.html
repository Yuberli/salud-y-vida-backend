<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle de Historia Clínica</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{security/layout::menu}" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4"></nav>

<div class="container py-4">

<h2 class="mb-4"><i class="bi bi-person-vcard"></i> Historia Clínica de
    <span th:text="${paciente.nombre + ' ' + paciente.apellido}"></span>
</h2>

<!-- Formulario para registrar nueva entrada -->
<form th:action="@{/historial/guardar}" method="post" th:object="${historiaClinica}" class="shadow-sm p-4 border rounded bg-light mb-4">
    <input type="hidden" th:field="*{paciente.idPaciente}"/>

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea th:field="*{descripcion}" class="form-control" rows="5" placeholder="Detalle del historial clínico..." required></textarea>
    </div>

    <div class="text-end">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-save-fill"></i> Registrar Entrada
        </button>
        <a th:href="@{/historial/inicio}" class="btn btn-secondary">Volver</a>
    </div>
</form>

<!-- Lista de entradas previas -->
<div class="shadow-sm p-4 border rounded bg-light">
    <h5><i class="bi bi-journal-text"></i> Entradas anteriores</h5>
    <table class="table table-striped table-hover mt-3">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Fecha de Registro</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${historiales}">
            <td th:text="${h.idHistoria}"></td>
            <td th:text="${h.descripcion}"></td>
            <td th:text="${h.fechaRegistro}"></td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</div>
</body>
</html>
