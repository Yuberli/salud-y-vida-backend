<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
  <meta charset="UTF-8">
  <title>SALUD Y VIDA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" type="application/javascript"></script>
</head>
<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SALUD Y VIDA</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" th:href="@{/home}">Home</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            Mantenimientos
          </a>
          <ul class="dropdown-menu">
            <li sec:authorize="hasAnyRole('ADMIN', 'RECEPCIONISTA')">
              <a class="dropdown-item" th:href="@{/paciente/inicio}">Pacientes</a>
              <a class="dropdown-item" th:href="@{/cita/inicio}">Citas Medicas</a>
              <a class="dropdown-item" th:href="@{/medico/inicio}">Medicos</a>
            </li>
            <li sec:authorize="hasAnyRole('ADMIN', 'MEDICO')">
              <a class="dropdown-item" th:href="@{/historial/inicio}">Historial Paciente</a>
            </li>
            <li sec:authorize="hasAnyRole('ADMIN', 'FARMACIA')">
              <a class="dropdown-item" th:href="@{/medicamento/inicio}">Medicamentos</a>
            </li>
            <li sec:authorize="hasAnyRole('ADMIN')">
              <a class="dropdown-item" th:href="@{/proveedor/inicio}">Proveedores</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
              <a class="dropdown-item" th:href="@{/security/user}">Usuarios</a>
            </li>
          </ul>
        </li>
      </ul>

      <form class="d-flex align-items-center" th:action="@{/auth/logout}" method="post">
        <span class="me-2" th:text="${session.nomusuario}">Usuario</span>
        <button class="btn btn-outline-danger" type="submit">Cerrar Sesión</button>
      </form>
    </div>
  </div>
</nav>

</body>
</html>
