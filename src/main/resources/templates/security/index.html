<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{security/layout::head}">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<nav th:replace="~{security/layout::menu}"></nav>
<div class="card">
    <div class="card-header">
        Mantenimiento de Usuarios
    </div>
    <div class="card-body">
        <a th:href="@{/security/user/create}" class="btn btn-primary" id="btnagregar">Agregar</a>
        <hr />
        <div id="divmensaje"></div>
        <table id="tblusers" class="table">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombres</th>
                <th scope="col">Apellidos</th>
                <th scope="col">Email</th>
                <th scope="col">Activo</th>
                <th scope="col">Actualizar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user :${userList}">
                <td th:text="${user.idusuario}"></td>
                <td th:text="${user.nombres}"></td>
                <td th:text="${user.apellidos}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.activo}"></td>
                <td><a th:href="@{/security/user/edit/{id}(id=${user.idusuario})}" class="btn btn-secondary">Editar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
