<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{security/layout::head}">
  <meta charset="UTF-8">
  <title>SALUD Y VIDA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" type="application/javascript"></script>
</head>
<body class="bg-light">
<nav th:replace="~{security/layout::menu}"></nav>
<br />
<div class="card">
  <div class="card-header text-bg-secondary">
    Mantenimiento de Usuarios
  </div>
  <div class="card-body">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      <strong>Éxito:</strong> <span th:text="${success}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>


    <h5 class="card-title">Registro de Usuarios</h5>
    <hr />
    <form th:action="@{/security/user/register}" th:object="${user}" method="post">
      <!-- <div class="form-floating mb-3">
        <input type="text" class="form-control" th:field="*{idusuario}" id="txtidusuario" placeholder="name@example.com">
        <label for="txtidusuario">ID Usuario</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" th:field="*{nomusuario}" id="txtnomusuario" placeholder="name@example.com">
        <label for="txtnomusuario">Nombre de Usuario</label>
      </div>-->
      <input type="hidden" th:field="*{idusuario}">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" th:field="*{nombres}" id="txtnombres" placeholder="name@example.com">
        <label for="txtnombres">Nombres</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" th:field="*{apellidos}" id="txtapellidos" placeholder="name@example.com">
        <label for="txtapellidos">Apellidos</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" th:field="*{email}" id="txtemail" placeholder="name@example.com">
        <label for="txtemail">Email</label>
      </div>
      <div>
        <label class="form-label">Roles:</label>
        <ul class="list-group">
          <li class="list-group-item" th:each="rol : ${rolList}">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" th:value="${rol.idrol}" th:field="*{rolesSeleccionados}">
              <label class="form-check-label" th:text="${rol.nomrol}"></label>
            </div>
          </li>
        </ul>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" th:field="*{activo}">
        <label class="form-check-label">Activo:</label>
      </div>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
  </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
