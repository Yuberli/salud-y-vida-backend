<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title th:text="${subject}">Email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    .header {
      background-color: #150953;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .content {
      padding: 30px 20px;
    }
    .footer {
      background-color: #f1f1f1;
      color: #666;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
<div class="email-container">
  <div class="header">
    <h1 th:text="${subject}">Asunto del correo</h1>
  </div>
  <div class="content">
    <p th:text="${message}">Contenido del mensaje</p>
  </div>
  <div class="footer">
    <p>© 2025 - CIBERTEC | Sistema Salud y Vida</p>
  </div>
</div>
</body>
</html>
