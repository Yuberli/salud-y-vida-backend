<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Citas Médicas</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">
        <i class="bi bi-calendar-plus-fill"></i> Registro de Citas Médicas
    </h2>
    <a href="/paciente/inicio" class="btn btn-outline-primary">
        <i class="bi bi-person-plus-fill"></i> Nuevo Paciente
    </a>
</div>

<form th:action="@{/cita/guardar}" method="post" th:object="${citaMedica}" class="row g-3 mb-4 shadow-sm p-4 border rounded bg-light">
    <input type="hidden" th:field="*{idCita}" />

    <!-- Paciente -->
    <div class="col-md-6">
        <label class="form-label">Paciente:</label>
        <select th:field="*{paciente.idPaciente}" class="form-select" required>
            <option value="">Seleccione un paciente</option>
            <option th:each="p : ${pacientes}" th:value="${p.idPaciente}" th:text="${p.nombre + ' ' + p.apellido}"></option>
        </select>
    </div>

    <!-- Médico -->
    <div class="col-md-6">
        <label class="form-label">Médico:</label>
        <select th:field="*{medico.idMedico}" class="form-select" id="medicoSelect" required>
            <option value="">Seleccione un médico</option>
            <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:text="${m.nombre + ' ' + m.apellido + ' - ' + m.especialidad.nombre}"></option>
        </select>
    </div>

    <!-- Fecha -->
    <div class="col-md-4">
        <label class="form-label">Fecha:</label>
        <input type="date" th:field="*{fecha}" class="form-control" id="fechaInput" required>
    </div>

    <!-- Hora dinámica -->
    <div class="col-md-4">
        <label class="form-label">Hora disponible:</label>
        <select th:field="*{hora}" class="form-select" id="horaSelect" required>
            <option value="">Seleccione médico y fecha</option>
        </select>
    </div>

    <!-- Estado -->
    <div class="col-md-4">
        <label class="form-label">Estado:</label>
        <select th:field="*{estado}" class="form-select">
            <option value="Pendiente">Pendiente</option>
            <option value="Confirmado">Confirmado</option>
            <option value="Cancelado">Cancelado</option>
        </select>
    </div>

    <div class="col-12 text-end">
        <button type="submit" class="btn btn-success"><i class="bi bi-download"></i> Registrar </button>
    </div>
</form>

<!-- Tabla de citas -->
<h3><i class="bi bi-list-ul"></i> Lista de Citas</h3>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Paciente</th><th>Médico</th><th>Fecha</th><th>Hora</th><th>Estado</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${lista}">
            <td th:text="${c.idCita}"></td>
            <td th:text="${c.paciente.nombre + ' ' + c.paciente.apellido}"></td>
            <td th:text="${c.medico.nombre + ' ' + c.medico.apellido}"></td>
            <td th:text="${c.fecha}"></td>
            <td th:text="${c.hora}"></td>
            <td th:text="${c.estado}"></td>
            <td>
                <button
                        class="btn btn-warning btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#modalEditar"
                        th:attr="data-id=${c.idCita},
                                 data-paciente=${c.paciente.idPaciente},
                                 data-medico=${c.medico.idMedico},
                                 data-fecha=${c.fecha},
                                 data-hora=${c.hora},
                                 data-estado=${c.estado}">
                    <i class="bi bi-pencil-square"></i>
                </button>

                <a th:href="@{/cita/eliminar/{id}(id=${c.idCita})}" onclick="return confirm('¿Eliminar cita?')" class="btn btn-danger btn-sm">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal de edición -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/cita/guardar}" method="post">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title" id="modalEditarLabel"><i class="bi bi-pencil-square"></i> Editar Cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body row g-3">
                    <input type="hidden" name="idCita" id="editIdCita">

                    <div class="col-md-6">
                        <label class="form-label">Paciente:</label>
                        <select name="paciente.idPaciente" id="editPaciente" class="form-select" required>
                            <option value="">Seleccione un paciente</option>
                            <option th:each="p : ${pacientes}" th:value="${p.idPaciente}" th:text="${p.nombre + ' ' + p.apellido}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Médico:</label>
                        <select name="medico.idMedico" id="editMedico" class="form-select" required>
                            <option value="">Seleccione un médico</option>
                            <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:text="${m.nombre + ' ' + m.apellido + ' - ' + m.especialidad.nombre}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Fecha:</label>
                        <input type="date" name="fecha" id="editFecha" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Hora:</label>
                        <input type="time" name="hora" id="editHora" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Estado:</label>
                        <select name="estado" id="editEstado" class="form-select">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Confirmado">Confirmado</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save2-fill"></i> Guardar Cambios</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts Bootstrap y dinámico -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const medicoSelect = document.getElementById("medicoSelect");
        const fechaInput = document.getElementById("fechaInput");
        const horaSelect = document.getElementById("horaSelect");

        medicoSelect.addEventListener("change", cargarHorariosDisponibles);
        fechaInput.addEventListener("change", cargarHorariosDisponibles);

        function cargarHorariosDisponibles() {
            const medicoId = medicoSelect.value;
            const fecha = fechaInput.value;

            if (medicoId && fecha) {
                fetch(`/horario/disponibles?idMedico=${medicoId}&fecha=${fecha}`)
                    .then(response => response.json())
                    .then(data => {
                        horaSelect.innerHTML = '<option value="">Seleccione una hora disponible</option>';
                        if (data.length > 0) {
                            data.forEach(horario => {
                                const option = document.createElement("option");
                                option.value = horario.hora;
                                option.textContent = horario.hora;
                                horaSelect.appendChild(option);
                            });
                        } else {
                            horaSelect.innerHTML = '<option value="">No hay horarios disponibles</option>';
                        }
                    })
                    .catch(error => {
                        console.error('Error al cargar horarios:', error);
                    });
            }
        }
    });
</script>

<script>
    const modalEditar = document.getElementById('modalEditar');
    modalEditar.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;

        document.getElementById('editIdCita').value = button.getAttribute('data-id');
        document.getElementById('editPaciente').value = button.getAttribute('data-paciente');
        document.getElementById('editMedico').value = button.getAttribute('data-medico');
        document.getElementById('editFecha').value = button.getAttribute('data-fecha');
        document.getElementById('editHora').value = button.getAttribute('data-hora');
        document.getElementById('editEstado').value = button.getAttribute('data-estado');
    });
</script>

</body>
</html>
