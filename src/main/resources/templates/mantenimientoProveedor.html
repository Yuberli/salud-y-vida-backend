<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Proveedores</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{security/layout::menu}" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4"></nav>

<div class="container py-4">

<h2 class="mb-4"><i class="bi bi-truck"></i> Registro de Proveedores</h2>

<!-- Alertas -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <th:block th:text="${success}"></th:block>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<form th:action="@{/proveedor/guardar}" method="post" th:object="${proveedor}"
      class="row g-3 mb-4 shadow-sm p-4 border rounded bg-light">

    <input type="hidden" th:field="*{idProveedor}"/>

    <div class="col-md-6">
        <label class="form-label">Razón Social:</label>
        <input type="text" th:field="*{razonSocial}" class="form-control" required>
    </div>

    <div class="col-md-6">
        <label class="form-label">RUC:</label>
        <input type="text" th:field="*{ruc}" class="form-control" required maxlength="11">
    </div>

    <div class="col-md-6">
        <label class="form-label">Teléfono:</label>
        <input type="text" th:field="*{telefono}" class="form-control">
    </div>

    <div class="col-md-6">
        <label class="form-label">Correo:</label>
        <input type="email" th:field="*{correo}" class="form-control">
    </div>

    <div class="col-12 text-end">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-download"></i> Guardar
        </button>
        <a href="/proveedor/inicio" class="btn btn-secondary"><i class="bi bi-plus-circle"></i> Nuevo Proveedor
        </a>
    </div>
</form>

<!-- Tabla de Proveedores -->
<h3><i class="bi bi-list-ul"></i> Lista de Proveedores</h3>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Razón Social</th><th>RUC</th><th>Teléfono</th><th>Correo</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${lista}">
            <td th:text="${p.idProveedor}"></td>
            <td th:text="${p.razonSocial}"></td>
            <td th:text="${p.ruc}"></td>
            <td th:text="${p.telefono}"></td>
            <td th:text="${p.correo}"></td>
            <td>
                <button
                        class="btn btn-warning btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#modalEditarProveedor"
                        th:attr="data-id=${p.idProveedor},
                             data-razonSocial=${p.razonSocial},
                             data-ruc=${p.ruc},
                             data-telefono=${p.telefono},
                             data-correo=${p.correo}">
                    <i class="bi bi-pencil-square"></i>
                </button>

                <a th:href="@{/proveedor/eliminar/{id}(id=${p.idProveedor})}"
                   onclick="return confirm('¿Eliminar proveedor?')"
                   class="btn btn-danger btn-sm">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal de edición -->
<div class="modal fade" id="modalEditarProveedor" tabindex="-1" aria-labelledby="modalEditarProveedorLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/proveedor/guardar}" method="post">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title" id="modalEditarProveedorLabel"><i class="bi bi-pencil-square"></i> Editar Proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body row g-3">
                    <input type="hidden" name="idProveedor" id="editIdProveedor">

                    <div class="col-md-6">
                        <label class="form-label">Razón Social:</label>
                        <input type="text" name="razonSocial" id="editRazonSocial" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">RUC:</label>
                        <input type="text" name="ruc" id="editRuc" class="form-control" maxlength="11" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Teléfono:</label>
                        <input type="text" name="telefono" id="editTelefono" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Correo:</label>
                        <input type="email" name="correo" id="editCorreo" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save2-fill"></i> Guardar Cambios</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS y Script para cargar datos al modal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modalEditarProveedor = document.getElementById('modalEditarProveedor');
    modalEditarProveedor.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;

        document.getElementById('editIdProveedor').value = button.getAttribute('data-id');
        document.getElementById('editRazonSocial').value = button.getAttribute('data-razonSocial');
        document.getElementById('editRuc').value = button.getAttribute('data-ruc');
        document.getElementById('editTelefono').value = button.getAttribute('data-telefono');
        document.getElementById('editCorreo').value = button.getAttribute('data-correo');
    });
</script>

</div>
</body>
</html>
